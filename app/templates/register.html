{% extends "base.html" %}
{% block title %}Crear cuenta{% endblock %}
{% block content %}
<section class="tarjeta">
    <h1>Crear cuenta</h1>
    <form method="post">
        <label>
            Nombre de usuario
            <input type="text" name="username" value="{{ username or '' }}" required>
        </label>
        <label>
            Correo electronico
            <input type="email" name="email" value="{{ email or '' }}" required>
        </label>
        <label>
            Contraseña (minimo 8 caracteres)
            <input type="password" name="password" required minlength="8">
        </label>
        <label class="checkbox">
            <input type="checkbox" name="consentimiento" value="1" {% if consentimiento %}checked{% endif %}>
            Acepto participar de forma voluntaria en la evaluacion del sistema.
        </label>
        <button type="submit" class="btn-primario">Crear cuenta</button>
    </form>
</section>
{% endblock %}
