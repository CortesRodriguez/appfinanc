{% extends "base.html" %}
{% block title %}Encuesta de comprension{% endblock %}
{% block content %}
<section class="tarjeta">
    <h1>Encuesta de comprension</h1>
    <p>Tus respuestas se guardan de forma <strong>anonima</strong>, sin vincularse a tu cuenta.</p>
    <form method="post">
        <label>
            Antes de usar la app, ¿cuanto crees que entendias sobre indicadores financieros?
            <select name="comprension_antes" required>
                <option value="">Selecciona…</option>
                <option>Nada</option>
                <option>Poco</option>
                <option>Regular</option>
                <option>Mucho</option>
            </select>
        </label>
        <label>
            Despues de usar la app, ¿cuanto crees que entiendes ahora?
            <select name="comprension_ahora" required>
                <option value="">Selecciona…</option>
                <option>Nada</option>
                <option>Poco</option>
                <option>Regular</option>
                <option>Mucho</option>
            </select>
        </label>
        <label>
            ¿Te resulto util para tomar decisiones informadas?
            <select name="utilidad" required>
                <option value="">Selecciona…</option>
                <option>No</option>
                <option>Un poco</option>
                <option>Bastante</option>
                <option>Mucho</option>
            </select>
        </label>
        <button type="submit" class="btn-primario">Enviar</button>
    </form>
</section>
{% endblock %}
